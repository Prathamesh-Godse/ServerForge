# ================================================================
# ServerForge — Mail Configuration
# ================================================================
# Used for two things:
#   1. Admin notifications — main.sh emails ADMIN_EMAIL when a
#      stage fails, and once when all stages complete.
#   2. WordPress's own mail() — password resets, comment
#      notifications, etc. Uses the same SMTP relay.
#
# Relays through Gmail SMTP. Requires a Google App Password, not
# your normal Gmail password — see Section 19.3 of the mail setup
# notes for how to generate one. This step happens on your Google
# Account, not on the server, and can't be automated here.
# ================================================================

# ── Where notifications go ──────────────────────────────────────
# Your own address — where Stage failure/completion emails are sent.
ADMIN_EMAIL=

# ── Gmail SMTP relay ─────────────────────────────────────────────
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587

# The Gmail address to send FROM. Consider using a dedicated Gmail
# account for this rather than your personal one — it keeps the
# App Password scoped to something you can revoke without touching
# your main account.
SMTP_USER=

# Google App Password (16 characters, no spaces). NOT your regular
# Gmail password — Gmail has not accepted regular passwords for
# SMTP since 2022. Generate one at:
#   myaccount.google.com → Security → 2-Step Verification → App passwords
SMTP_PASSWORD=
